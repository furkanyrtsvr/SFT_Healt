# Rotary encoder, buton ve HX711 basinc modulu
CONFIG_GPIO=y

# DHT11 ortam sicakligi ve bagil nem sensoru
CONFIG_SENSOR=y
CONFIG_DHT=y
CONFIG_DHT_LOCK_IRQS=y

# OLED ve MAX30102 ortak I2C hatti
CONFIG_I2C=y

# SSD1306 OLED ekran
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# Profil ve basinc kalibrasyonunu kalici bellekte saklama
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Bellek ayarlari
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Simdilik loglari kapat
CONFIG_LOG=n

# Bluetooth Low Energy ve Nordic UART Service
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="nRF52840_fy"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_NUS=y
